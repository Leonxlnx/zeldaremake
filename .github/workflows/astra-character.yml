name: Astra character motion
on:
  push:
    branches: ['agent/astra-link-movement']
    paths: ['src/**', 'public/**', 'package*.json', 'gauntlet/scripts/capture-motion.mjs', 'gauntlet/scripts/archive-character-capture.mjs', 'gauntlet/scripts/publish-character-capture.mjs', 'gauntlet/scripts/test-character-publication.mjs', '.github/workflows/astra-character.yml']
  workflow_dispatch:
    inputs:
      sequence:
        description: 'Also capture a continuous motion clip'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: astra-character-${{ github.sha }}
  cancel-in-progress: false
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node gauntlet/scripts/test-character-publication.mjs
      - run: node src/world/character/locomotion.test.mjs
      - run: node src/world/character/eye-geometry.test.mjs
      - run: node src/world/character/boot-articulation.test.mjs
      - run: node src/camera/follow.test.mjs
      - run: node src/world/structures/foliage-shadow.test.mjs
      - run: node src/world/structures/consolidation-shadow.test.mjs
      - run: npm run build
      - name: Decide whether motion needs a new clip
        id: capture-mode
        env:
          REQUEST_SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          COMPARE_BASE=
          if git fetch --no-tags --depth=1 origin captures/astra-character; then
            COMPARE_BASE="$(git show FETCH_HEAD:motion.json | node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).source);')"
          fi
          if [[ "$COMPARE_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            git cat-file -e "$COMPARE_BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$COMPARE_BASE"
          else
            REQUEST_SEQUENCE=true
            COMPARE_BASE=HEAD^
          fi
          # Different source commits have independent capture slots. Compare with
          # the last published capture to decide whether this source needs a clip.
          # Include character helpers/materials: their edits can change the rendered
          # player even when the top-level builder and controller files are unchanged.
          if [ "$REQUEST_SEQUENCE" = 'true' ] || ! git diff --quiet "$COMPARE_BASE" HEAD -- src/world/character/ src/camera/follow.ts gauntlet/scripts/capture-motion.mjs; then
            echo 'sequence=1' >> "$GITHUB_OUTPUT"
          else
            echo 'sequence=0' >> "$GITHUB_OUTPUT"
          fi
      - name: Install the clip encoder
        if: steps.capture-mode.outputs.sequence == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Capture actual character motion and object details
        env:
          CAPTURE_SEQUENCE: ${{ steps.capture-mode.outputs.sequence }}
        run: |
          rm -rf gauntlet/out/astra-character
          node gauntlet/scripts/capture-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-character-${{ github.sha }}
          path: gauntlet/out/astra-character
          retention-days: 30
      - name: Preserve gallery and publish the completed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_SEQUENCE: ${{ steps.capture-mode.outputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          node gauntlet/scripts/publish-character-capture.mjs "$GITHUB_WORKSPACE/gauntlet/out/astra-character" "https://github.com/$GITHUB_REPOSITORY.git"
