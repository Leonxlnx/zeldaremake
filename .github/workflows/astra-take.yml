name: Astra gauntlet take
on:
  push:
    branches: ['agent/astra-link-movement']
    paths: ['.agents/astra-take-note.txt', '.github/workflows/astra-take.yml']
  workflow_dispatch:
permissions:
  contents: write
# Share the canonical monitor writer's lock; take.mjs also handles concurrent
# writers by fetching and appending again without rewriting existing entries.
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  take:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Git identity for the generated take
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Capture, score and append Astra's take
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node gauntlet/scripts/take.mjs --agent astra --items C01,C02,C03,W22,W26 \
            --note "$(cat .agents/astra-take-note.txt)" --publish --settle 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-take-${{ github.sha }}
          path: gauntlet/out/last
          if-no-files-found: warn
          retention-days: 30
