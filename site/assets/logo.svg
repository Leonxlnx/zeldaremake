<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Director's Monitor">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- clapper top, hinged open -->
  <g transform="rotate(-14 8 22)">
    <rect x="6" y="14" width="48" height="10" rx="2" fill="#0d0d0f"/>
    <g fill="#ebe6dc">
      <polygon points="10,14 18,14 14,24 6,24"/>
      <polygon points="26,14 34,14 30,24 22,24"/>
      <polygon points="42,14 50,14 46,24 38,24"/>
    </g>
    <rect x="6" y="14" width="48" height="10" rx="2" fill="url(#gl)"/>
  </g>
  <!-- slate body -->
  <rect x="6" y="26" width="48" height="30" rx="3" fill="url(#g)" stroke="#3a3a41" stroke-width="1"/>
  <rect x="6" y="26" width="48" height="6" fill="#0d0d0f"/>
  <g fill="#ebe6dc">
    <polygon points="10,26 16,26 13,32 7,32"/>
    <polygon points="22,26 28,26 25,32 19,32"/>
    <polygon points="34,26 40,26 37,32 31,32"/>
    <polygon points="46,26 52,26 49,32 43,32"/>
  </g>
  <!-- kokiri leaf -->
  <path d="M22 50c2-9 8-13 18-14-1 9-6 14-15 15l-3 1z" fill="#8fc64a"/>
  <path d="M23 50c4-5 8-8 14-11" stroke="#0d0d0f" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- tungsten rec dot -->
  <circle cx="46" cy="42" r="3" fill="#f2b866"/>
</svg>
