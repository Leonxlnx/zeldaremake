plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

sourceSets {
    // Pure-Java core (storage, compression, meshing, selection) with no Minecraft dependency,
    // so it can be unit-tested and benchmarked headlessly.
    bench {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    benchImplementation.extendsFrom implementation
    benchRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "io.airlift:aircompressor:${project.aircompressor_version}"
    include "io.airlift:aircompressor:${project.aircompressor_version}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

tasks.register('bench', JavaExec) {
    group = 'verification'
    description = 'Headless pipeline benchmark (generation, downsampling, meshing, compression, selection).'
    classpath = sourceSets.bench.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'dev.vista.bench.PipelineBench'
    maxHeapSize = '3G'
    args = project.hasProperty('benchArgs') ? project.benchArgs.split(' ').toList() : []
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

loom {
    runs {
        client {
            vmArgs '-Xmx4G'
        }
    }
}
