<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shipboard</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #07090c;
      overflow: hidden;
      color: #e7f6f2;
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }
    #app, canvas { display: block; width: 100%; height: 100%; }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.55;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: #d7fff4;
    }
    #crosshair::before { left: 4px; top: 0; width: 2px; height: 10px; }
    #crosshair::after { top: 4px; left: 0; height: 2px; width: 10px; }
    #prompt {
      position: fixed;
      left: 50%;
      bottom: 11%;
      transform: translateX(-50%);
      padding: 8px 14px;
      border: 1px solid rgba(140, 255, 230, 0.4);
      background: rgba(6, 12, 14, 0.62);
      color: #dffef6;
      letter-spacing: 0.14em;
      font-size: 14px;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s linear;
    }
    #prompt.show { opacity: 1; }
    #status {
      position: fixed;
      left: 22px;
      bottom: 18px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f0e2cc;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      min-height: 1.2em;
    }
    #fade {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.55s ease;
      z-index: 5;
    }
    #fade.on { opacity: 1; }
    #fade span {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 20px;
      color: #f3eadc;
    }
    #lock {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8vh;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.45), transparent 40%);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 14px;
      pointer-events: none;
      z-index: 4;
    }
    #lock.hide { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="status">Flight cycle</div>
  <div id="fade"><span></span></div>
  <div id="lock">Click to look · WASD move · E use</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
